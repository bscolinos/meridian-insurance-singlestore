<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" role="img" aria-label="Meridian">
  <title>Meridian</title>
  <!-- Meridian glyph: a globe with longitude (meridian) arcs -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.8">
    <circle cx="20" cy="20" r="13"/>
    <ellipse cx="20" cy="20" rx="5" ry="13"/>
    <line x1="7" y1="20" x2="33" y2="20"/>
  </g>
  <!-- accent meridian arc sweeping across the globe -->
  <path d="M9.2 12 A13 13 0 0 1 30.8 12" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
  <text x="42" y="27" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.3" fill="#FFFFFF">Meridian</text>
</svg>
